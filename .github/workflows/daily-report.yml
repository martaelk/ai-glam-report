name: Daily AI GLAM Report

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Send report
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python ai_glam_report.py

      - name: Commit updated article history
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add sent_articles.json

          git commit -m "Update sent articles history" || echo "No changes"

          git push
